name: Sorted
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
options:
  bundleIdPrefix: com.olivervirt
schemes:
  Sorted:
    build:
      targets:
        Sorted: all
    run:
      config: Debug
      storeKitConfiguration: Sorted/DaCapo.storekit
targets:
  Sorted:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sorted]
    info:
      path: Sorted/Info.plist
      properties:
        NSAppleMusicUsageDescription: "Da Capo reads your music library to organise it into playlists. Nothing leaves your device."
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDisplayName: Da Capo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivervirt.dacapo
        DEVELOPMENT_TEAM: NLP9537CF4
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: Da Capo Dev
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
